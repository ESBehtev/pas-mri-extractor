services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-pas-mri-extractor:local}
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model
      - ${VLLM_MODEL}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN}
      - --api-key
      - ${PAS_API_KEY}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      HF_TOKEN: ${HF_TOKEN}
    gpus: all
    ipc: host
    restart: unless-stopped
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

volumes:
  huggingface-cache:
