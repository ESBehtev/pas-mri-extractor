[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pas-mri-extractor"
version = "0.1.0"
description = "MRI PAS feature extraction"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic",
    "PyYAML",
    "python-dotenv",
    "streamlit",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
