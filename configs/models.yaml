default_model: openai_compatible

models:
  openai_compatible:
    display_name: OpenAI-compatible API
    base_url: ""
    api_key_env: PAS_API_KEY
    model: ""
    timeout: 60
    generation:
      temperature: 0.0
      max_tokens: 2048
    output:
      response_format:
        type: json_object
      enforce_json: true
      fallback_on_unsupported_response_format: false
